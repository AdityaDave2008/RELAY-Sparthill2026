          type: string
          format: uuid
          title: Interpretation Id
        incident_id:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Incident Id
        destination_shelter_id:
          type: string
          maxLength: 80
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Destination Shelter Id
        original_text:
          type: string
          maxLength: 4096
          minLength: 1
          title: Original Text
        transcription_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Transcription Id
      additionalProperties: false
      type: object
      required:
      - operation_id
      - interpretation_id
      - incident_id
      - destination_shelter_id
      - original_text
      title: InterpretationSubmission
