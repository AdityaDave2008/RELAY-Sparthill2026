components:
  schemas:
    DeviceRegistration:
      properties:
        device_id:
          type: string
          format: uuid
          title: Device Id
        signing_key:
          type: string
          maxLength: 128
          title: Signing Key
        encryption_key:
          type: string
          maxLength: 64
          title: Encryption Key
      additionalProperties: false
      type: object
      required:
      - device_id
      - signing_key
      - encryption_key
      title: DeviceRegistration
    DirectoryEntry:
      properties:
        shelter_id:
          type: string
          title: Shelter Id
        incident_id:
          type: string
          title: Incident Id
        display_name:
          type: string
          title: Display Name
        receiver:
          anyOf:
          - $ref: '#/components/schemas/ShelterReceiver'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - shelter_id
      - incident_id
      - display_name
      title: DirectoryEntry
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
          default: false
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      examples:
      - error:
          code: idempotency_conflict
          message: An identifier was already used with different immutable content
          retryable: false
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
        api_version:
          type: string
          title: Api Version
        schema_version:
          type: integer
          const: 1
          title: Schema Version
        mode:
          type: string
          enum:
          - local-test
          - aws
          title: Mode
        storage:
          type: string
          enum:
          - sqlite
          - dynamodb
          title: Storage
        performs_ai_check:
          type: boolean
          const: false
          title: Performs Ai Check
          default: false
        note:
          type: string
          title: Note
      additionalProperties: false
      type: object
      required:
      - status
      - api_version
      - schema_version
      - mode
      - storage
      - note
      title: Health
    InboxRequestResult:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        schema_version:
          type: integer
          const: 1
          title: Schema Version
        revision:
          type: integer
          const: 1
          title: Revision
        submission:
          $ref: '#/components/schemas/RequestSubmission'
        accepted_at:
          type: string
          format: date-time
          title: Accepted At
        cloud_state:
          type: string
          const: accepted
          title: Cloud State
        analysis_state:
          type: string
          enum:
          - pending
          - retrying
          - ready_for_review
          - needs_review
          - failed
          title: Analysis State
        result:
          anyOf:
          - $ref: '#/components/schemas/ValidatedResult'
          - type: 'null'
        analysis_attempts:
          type: integer
          title: Analysis Attempts
        manual_retry_count:
          type: integer
          title: Manual Retry Count
          default: 0
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
        provider_evidence:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Provider Evidence
        assignment_state:
          type: string
          enum:
          - not_implemented
          - unassigned
          - reserved
          - released
          - fulfilled
          title: Assignment State
        fulfillment_state:
          type: string
          enum:
          - not_implemented
          - not_fulfilled
          - fulfilled
          title: Fulfillment State
        history:
          $ref: '#/components/schemas/RequestHistory'
        reservation:
          anyOf:
          - $ref: '#/components/schemas/Reservation'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - request_id
      - schema_version
      - revision
      - submission
      - accepted_at
      - cloud_state
      - analysis_state
      - result
      - analysis_attempts
      - error
      - provider_evidence
      - assignment_state
      - fulfillment_state
      - history
      - reservation
      title: InboxRequestResult
    InterpretationResult:
      properties:
        interpretation_id:
          type: string
          format: uuid
          title: Interpretation Id
        status:
          type: string
          enum:
          - pending
          - ready_for_review
          - needs_review
          - failed
          title: Status
        result:
          anyOf:
          - $ref: '#/components/schemas/ValidatedResult'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - interpretation_id
      - status
      title: InterpretationResult
    InterpretationSubmission:
