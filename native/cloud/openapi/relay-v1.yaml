    and coordinator inventory ledger. Inventory fulfillment is a staff-recorded stock
    transaction, not proof of physical delivery. Nearby gateway ingestion verifies
    enrolled sender signatures. See docs/INTEGRATION_HANDOFF.md for idempotency, PKCE,
    review and retry semantics.
